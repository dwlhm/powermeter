<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Gauge Track Gradient -->
    <linearGradient id="gauge-val-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Needle Gradient -->
    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Bolt Glow Filter -->
    <filter id="bolt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Outer Dial Ring Background -->
  <path d="M 150 346 A 150 150 0 1 1 362 346" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />
  <path d="M 150 346 A 150 150 0 1 1 362 346" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round" />

  <!-- Active Value Arc (75% power gauge level) -->
  <path d="M 150 346 A 150 150 0 1 1 391 200" fill="none" stroke="url(#gauge-val-grad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Dial Tick Marks -->
  <circle cx="150" cy="346" r="4.5" fill="#64748b" />
  <circle cx="106" cy="240" r="4.5" fill="#38bdf8" />
  <circle cx="150" cy="134" r="4.5" fill="#38bdf8" />
  <circle cx="256" cy="90" r="5.5" fill="#38bdf8" />
  <circle cx="362" cy="134" r="4.5" fill="#34d399" />
  <circle cx="406" cy="240" r="4.5" fill="#fbbf24" />
  <circle cx="362" cy="346" r="4.5" fill="#ef4444" />

  <!-- Central Power Meter Lightning Bolt -->
  <path d="M 276 130 L 196 256 H 252 L 232 350 L 324 224 H 268 Z" fill="url(#bolt-grad)" filter="url(#bolt-glow)" />

  <!-- Gauge Pointer / Needle -->
  <g transform="rotate(35, 256, 270)">
    <polygon points="250,270 262,270 258,125 254,125" fill="url(#needle-grad)" />
  </g>

  <!-- Pivot Hub -->
  <circle cx="256" cy="270" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  <circle cx="256" cy="270" r="7" fill="#38bdf8" />

  <!-- Digital Readout Display Box at Bottom -->
  <rect x="166" y="385" width="180" height="48" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="3" />
  <rect x="168" y="387" width="176" height="44" rx="10" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Digital Text Readout -->
  <text x="256" y="417" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle" letter-spacing="2">VOLTIQ</text>

  <!-- Accent Corner Glow -->
  <circle cx="400" cy="110" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="110" cy="400" r="4" fill="#06b6d4" filter="url(#glow)" />
</svg>
